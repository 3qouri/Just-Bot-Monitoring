name: JUST Telegram Bot

'on':
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create browser profile directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Users\owndi\just_bot\browser_profile" | Out-Null

      - name: Restore bot data and browser profile
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\owndi\just_bot\browser_profile
            course_states.json
            watched_course.json
            course_metadata.json
            users.json
          key: just-bot-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            just-bot-state-${{ github.ref_name }}-

      - name: Install Python packages
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Patchright Chromium
        shell: powershell
        run: |
          patchright install chromium

      - name: Run JUST Bot
        shell: powershell
        run: |
          python JUST_Course_Monitor_Bot_ALL_DEPARTMENTS_MULTI_USER_SUPER.py
