name: JUST Telegram Bot

'on':
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Chrome
        shell: powershell
        run: |
          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            Write-Error "Google Chrome was not found on this self-hosted runner."
          }
          Write-Host "Chrome: $chrome"

      - name: Create browser profile directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Users\owndi\just_bot\browser_profile" | Out-Null

      - name: Install Python packages
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Patchright Chromium
        shell: powershell
        run: |
          patchright install chromium

      - name: Run JUST Bot
        shell: powershell
        run: |
          python JUST_Course_Monitor_Bot_ALL_DEPARTMENTS_MULTI_USER_SUPER.py
