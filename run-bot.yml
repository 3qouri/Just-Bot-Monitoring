name: JUST Telegram Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: windows-2025
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare exact Windows environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\Users\owndi\just_bot\browser_profile' | Out-Null

      - name: Restore bot state and browser profile
        uses: actions/cache/restore@v4
        with:
          path: |
            users.json
            course_states.json
            watched_course.json
            course_metadata.json
            result.html
            result.png
            C:\Users\owndi\just_bot\browser_profile
          key: just-bot-state-${{ github.run_id }}
          restore-keys: |
            just-bot-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for Patchright
        shell: pwsh
        run: |
          python -m patchright install chromium

      - name: Verify Chrome and Python environment
        shell: pwsh
        run: |
          python --version
          python -c "import requests, bs4, patchright; print('Python packages OK')"
          $chrome = Get-Command chrome.exe -ErrorAction SilentlyContinue
          if (-not $chrome) {
            Write-Error 'Google Chrome was not found on the GitHub runner.'
            exit 1
          }
          Write-Host "Chrome: $($chrome.Source)"

      - name: Run bot
        shell: pwsh
        run: |
          python .\JUST_Course_Monitor_Bot_ALL_DEPARTMENTS_MULTI_USER.py

      - name: Save bot state and browser profile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            users.json
            course_states.json
            watched_course.json
            course_metadata.json
            result.html
            result.png
            C:\Users\owndi\just_bot\browser_profile
          key: just-bot-state-${{ github.run_id }}
